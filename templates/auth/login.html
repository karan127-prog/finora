<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FINORA - Your Money. Your Control.</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #E6EFF6 0%, #F3F7FA 90%);
            padding: 24px;
        }
        .auth-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            box-shadow: 0 20px 40px -10px rgba(52, 68, 84, 0.08);
        }
        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            text-align: center;
        }
        .auth-brand .brand-logo-icon {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 8px 16px rgba(120, 155, 184, 0.28);
        }
        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-top: 4px;
        }
        @media (max-width: 480px) {
            body {
                padding: 14px;
            }
            .auth-card {
                padding: 24px 18px;
                border-radius: 18px;
            }
            .auth-title {
                font-size: 1.35rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo-icon">
                <i data-lucide="sparkles" style="width: 26px; height: 26px;"></i>
            </div>
            <h1 class="auth-title">FINORA</h1>
            <p class="auth-subtitle">Your Money. Your Control.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div style="margin-bottom: 18px;">
                    {% for category, message in messages %}
                        <div class="flash-alert {{ category }}" style="font-size: 0.82rem; padding: 10px 14px;">
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Quick One-Click Demo Access -->
        <form action="{{ url_for('auth.login') }}" method="POST" style="margin-bottom: 20px;">
            <input type="hidden" name="action" value="demo_login">
            <button type="submit" class="btn btn-secondary" style="width: 100%; border: 1px dashed var(--secondary); background: #E6EFF6; color: var(--text-primary);">
                <i data-lucide="zap" style="color: var(--secondary);"></i>
                <span>One-Click Instant Demo Access</span>
            </button>
        </form>

        <div style="display: flex; align-items: center; margin: 20px 0; gap: 10px;">
            <div style="flex: 1; height: 1px; background-color: var(--border);"></div>
            <span style="font-size: 0.72rem; color: var(--text-secondary); text-transform: uppercase;">or sign in with email</span>
            <div style="flex: 1; height: 1px; background-color: var(--border);"></div>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@company.com" required value="demo@finora.app">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label class="form-label" style="margin-bottom: 0;">Password</label>
                </div>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required value="password123">
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-secondary); cursor: pointer;">
                    <input type="checkbox" name="remember" checked style="accent-color: var(--secondary);">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
                <span>Sign In to Finora</span>
                <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.84rem; color: var(--text-secondary);">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 600; color: var(--secondary);">Create an account</a>
        </div>
    </div>

    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
