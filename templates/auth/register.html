<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | FINORA - Your Money. Your Control.</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #E6EFF6 0%, #F3F7FA 90%);
            padding: 24px;
        }
        .auth-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            box-shadow: 0 20px 40px -10px rgba(52, 68, 84, 0.08);
        }
        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            text-align: center;
        }
        .auth-brand .brand-logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            margin-bottom: 10px;
            box-shadow: 0 8px 16px rgba(120, 155, 184, 0.28);
        }
        .auth-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-top: 4px;
        }
        @media (max-width: 480px) {
            body {
                padding: 14px;
            }
            .auth-card {
                padding: 24px 18px;
                border-radius: 18px;
            }
            .auth-title {
                font-size: 1.35rem !important;
            }
            .auth-grid-2 {
                grid-template-columns: 1fr !important;
                gap: 0 !important;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo-icon">
                <i data-lucide="sparkles" style="width: 24px; height: 24px;"></i>
            </div>
            <h1 class="auth-title">Create Your Finora Account</h1>
            <p class="auth-subtitle">Your Money. Your Control.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div style="margin-bottom: 18px;">
                    {% for category, message in messages %}
                        <div class="flash-alert {{ category }}" style="font-size: 0.82rem; padding: 10px 14px;">
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Aarav Sharma" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="aarav@domain.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Preferred Currency</label>
                <select name="currency" class="form-select">
                    <option value="INR" selected>Indian Rupee (₹ - INR)</option>
                    <option value="USD">US Dollar ($ - USD)</option>
                    <option value="EUR">Euro (€ - EUR)</option>
                    <option value="GBP">British Pound (£ - GBP)</option>
                </select>
            </div>

            <div class="auth-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
                <span>Create Account</span>
                <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.84rem; color: var(--text-secondary);">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 600; color: var(--secondary);">Sign in</a>
        </div>
    </div>

    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
